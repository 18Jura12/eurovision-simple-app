<div *ngIf="showVotePrompt" class="vote-prompt-overlay">
  <div class="vote-prompt-dialog">
    <p class="vote-prompt-title">You have already voted.</p>
    <p class="vote-prompt-subtitle">How would you like to start?</p>
    <div class="vote-prompt-buttons">
      <button class="btn btn-secondary" (click)="onLoadPrevious()">Load previous ranking</button>
      <button class="btn btn-vote" (click)="onResetOrder()">Running order (default)</button>
    </div>
  </div>
</div>

<div class="vote-container">
  <form [formGroup]="voteForm" (ngSubmit)="onSubmit()">
    <div formArrayName="votes" class="drag-list" cdkDropList (cdkDropListDropped)="drop($event)">
      <div
        *ngFor="let songForm of songControls; let i=index"
        [formGroupName]="i">
        <div class="drag-item" cdkDrag>
          <input
            type="number"
            formControlName="vote"
            class="rank-badge"
            readonly>
          <span [ngClass]="'flag-icon flag-icon-' + getSongDetails(i).countryFlag + ' flag'"></span>
          <div class="country-info">
            <span [ngClass]="setClass(i) + ' country-name'">{{ getSongDetails(i).countryName }}</span>
            <span class="song-info" *ngIf="getSongDetails(i).artist || getSongDetails(i).song">{{ getSongDetails(i).artist }} &ndash; &quot;{{ getSongDetails(i).song }}&quot;</span>
          </div>
          <span
            class="lyrics-trigger"
            *ngIf="hasLyrics(getSongDetails(i).countryName)"
            title="Lyrics"
            (click)="$event.stopPropagation(); openLyrics(getSongDetails(i).countryName)">
            <i class="bi bi-file-text"></i>
          </span>
          <span class="drag-handle" cdkDragHandle>&#8942;</span>
        </div>
        <div class="qualline" *ngIf="i === 9 && !isFinal"></div>
      </div>
    </div>

    <div class="vote-footer">
      <button class="btn btn-vote" type="submit" [disabled]="voteForm.invalid || isLoading">
        {{ hasVoted ? 'Update' : 'Vote' }}
      </button>
      <button *ngIf="hasVoted" class="btn btn-cancel" type="button" (click)="onCancel()">
        Cancel
      </button>
      <button *ngIf="!hasVoted" class="btn btn-cancel" type="button" (click)="onBack()">
        Back
      </button>
      <app-loading-spinner *ngIf="isLoading"></app-loading-spinner>
    </div>
  </form>
</div>

<app-lyrics-panel
  [open]="lyricsPanelOpen"
  [entry]="selectedLyrics"
  [countryName]="lyricsCountry"
  [countryFlag]="lyricsFlag"
  (closed)="closeLyrics()">
</app-lyrics-panel>
